[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "conways-game-of-life"
dynamic = ["version"]
description = "A native-feeling macOS implementation of Conway's Game of Life"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Greg Pfountz"}]
license = "GPL-3.0-only"
license-files = [
  "LICENSE",
  "LICENSING.md",
  "src/gameoflife/legal_texts/THIRD_PARTY_NOTICES.md",
  "src/gameoflife/legal_texts/third-party/*/*",
]
dependencies = [
  "PySide6>=6.8",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
conways-game-of-life = "gameoflife.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gameoflife.__version__"}

[tool.setuptools.package-data]
gameoflife = ["legal_texts/*", "legal_texts/third-party/*/*"]

[tool.setuptools.data-files]
"share/conways-game-of-life" = [
  "src/gameoflife/assets/ConwaysGameOfLife.icns",
  "src/gameoflife/assets/conways-life-icon.png",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
  "mypy>=1.0"
  ]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["Foundation"]
ignore_missing_imports = true
