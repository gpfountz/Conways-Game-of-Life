[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "conways-game-of-life"
dynamic = ["version"]
description = "A native-feeling macOS implementation of Conway's Game of Life"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Greg Pfountz"}]
license = "GPL-3.0-only"
license-files = [
  "LICENSE",
  "LICENSING.md",
  "src/gameoflife/legal_texts/THIRD_PARTY_NOTICES.md",
  "src/gameoflife/legal_texts/third-party/*/*",
]
dependencies = [
  # Qt 6.12 raises the macOS wheel minimum from 13 to 14 and splits packages.
  "PySide6>=6.11.3,<6.12",
  "pyobjc-core>=13.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=13.0; sys_platform == 'darwin'",
]

[project.scripts]
conways-game-of-life = "gameoflife.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gameoflife.__version__"}

[tool.setuptools.package-data]
gameoflife = ["legal_texts/*", "legal_texts/third-party/*/*"]

[tool.setuptools.data-files]
"share/conways-game-of-life" = [
  "src/gameoflife/assets/ConwaysGameOfLife.icns",
  "src/gameoflife/assets/conways-life-icon.png",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.3",
  "mypy>=2.4.1"
  ]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["Foundation"]
ignore_missing_imports = true
