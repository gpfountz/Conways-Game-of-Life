[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conways-game-of-life"
version = "1.0.12"
description = "A native-feeling macOS implementation of Conway's Game of Life"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
conways-game-of-life = "gameoflife.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/conways-game-of-life" = [
  "assets/ConwaysGameOfLife.icns",
  "assets/conways-life-icon.png",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0", 
  "ruff>=0.12", 
  "mypy>=1.0"
  ]

[tool.pytest.ini_options]
testpaths = ["tests"]
